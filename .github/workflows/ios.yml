name: ios

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # latest 릴리스에 결과물을 올린다

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # OpenSSL · FreeRDP 빌드가 가장 오래 걸린다. 스크립트가 바뀌지 않았으면 지난 결과를 쓴다.
      # 앱 빌드가 실패해도 의존성은 남도록 복원·저장을 나눈다(actions/cache 는 작업 전체가 성공해야 저장한다).
      - name: 의존성 캐시 복원
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: Vendor
          key: vendor-${{ hashFiles('scripts/build-deps.sh') }}

      - name: 도구 설치
        run: brew install ninja pkg-config xcodegen

      - name: OpenSSL · FreeRDP 빌드
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-deps.sh

      - name: 의존성 캐시 저장
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Vendor
          key: vendor-${{ hashFiles('scripts/build-deps.sh') }}

      - name: Xcode 프로젝트 생성
        run: xcodegen generate

      - name: 앱 빌드 (서명 없이)
        run: |
          xcodebuild -project RdpApp.xcodeproj -scheme RdpApp -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO build

      - name: 묶기
        run: |
          mkdir -p dist build/ipa/Payload
          cp -R build/dd/Build/Products/Debug-iphoneos/RdpApp.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../../dist/RdpApp-unsigned.ipa Payload)
          zip -qry dist/RdpApp-xcode.zip RdpApp RdpApp.xcodeproj Vendor/include Vendor/lib/libfreerdp-all.a project.yml README.md

      - uses: actions/upload-artifact@v4
        with:
          name: RdpApp
          path: dist/*

      - name: latest 릴리스에 올리기
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* --target "${{ github.sha }}" \
            --title "최신 빌드" --notes "커밋 ${{ github.sha }}"
